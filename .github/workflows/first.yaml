name: my first workflow in action

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: step1 
        run: echo "welcome to job1" > vishal.txt
      - uses: actions/upload-artifact@v4
        with:
          name: myfile1
          path: vishal.txt

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: 
          name: myfile1
        
      - run : cat vishal.txt
      
  job3:
    runs-on: ubuntu-latest
    steps:
      - name: show predefined variables
        run: | 
             echo "my repo: $GITHUB_REPOSITORY"
             echo "branch: $GITHUB_REF"
             echo "triggered by: $GITHUB_ACTOR"
             echo "my city:  $CITY"
 
